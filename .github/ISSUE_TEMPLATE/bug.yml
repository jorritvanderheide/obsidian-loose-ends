name: Bug report
description: Something in Loose Ends doesn't work the way the README says it should.
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report this. Before you start, have a quick look at the [FAQ](https://github.com/jorritvanderheide/obsidian-loose-ends/blob/main/FAQ.md): the most common surprises, like an unfiled tag that keeps coming back, are explained there.

              Found a security problem? Please don't report it here. Use [private reporting](https://github.com/jorritvanderheide/obsidian-loose-ends/security/advisories/new) instead.

    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: And what did you expect to happen instead?
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: The smallest example that shows the problem helps most, such as one note's frontmatter before and after. A screenshot helps too.
          placeholder: |
              1. Make a note with Add note
              2. Run File note and pick domain/work
              3. ...
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: Loose Ends version
          description: Settings → Community plugins, next to Loose Ends.
      validations:
          required: true

    - type: input
      id: obsidian
      attributes:
          label: Obsidian version
          description: Settings → General.
      validations:
          required: true

    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: macOS 15, Windows 11, iOS 18, Android 15, ...
      validations:
          required: true

    - type: textarea
      id: axes
      attributes:
          label: Your axes
          description: Each axis and its values, as in Settings → Loose Ends → Axes.
          placeholder: |
              domain: work, personal
              source: article, book, meeting
          render: text
      validations:
          required: true

    - type: input
      id: folder
      attributes:
          label: Notes folder and unfiled tag
          placeholder: 'Notes, inbox'
      validations:
          required: true

    - type: dropdown
      id: template
      attributes:
          label: Was a template involved?
          options:
              - 'No'
              - 'Yes, the Default template'
              - 'Yes, a template of my own'
      validations:
          required: true

    - type: textarea
      id: extra
      attributes:
          label: Anything else?
          description: Other plugins that write tags or frontmatter (such as Templater, Linter or Tag Wrangler), an error from the developer console (Ctrl+Shift+I, or Cmd+Option+I on a Mac), or anything else that seems related. If a template is involved, please paste it.
